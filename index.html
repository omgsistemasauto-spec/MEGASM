<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMG Sistemas — Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --azul:#004aad;
  --azul2:#1a6fd4;
  --azul3:#0a3d8f;
  --branco:#fff;
  --cinza:#f1f5f9;
  --txt:#1e293b;
  --sub:#64748b;
  --borda:#e2e8f0;
  --erro:#ef4444;
  --verde:#22c55e;
}

html,body{
  height:100%;width:100%;
  font-family:'DM Sans',sans-serif;
  background:var(--azul3);
  overflow:hidden
}

/* ── FUNDO ANIMADO ── */
.bg{
  position:fixed;inset:0;
  background:linear-gradient(135deg,#002d6e 0%,#004aad 50%,#0369a1 100%);
  z-index:0
}
.bg::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 60% at 20% 80%,rgba(0,100,200,.35) 0%,transparent 60%),
             radial-gradient(ellipse 60% 80% at 80% 20%,rgba(0,180,255,.2) 0%,transparent 60%);
}
.grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:48px 48px;
}
.orb{
  position:absolute;border-radius:50%;filter:blur(80px);opacity:.25;
  animation:flutuaOrb 8s ease-in-out infinite alternate
}
.orb1{width:400px;height:400px;background:#60a5fa;top:-100px;left:-100px;animation-delay:0s}
.orb2{width:300px;height:300px;background:#38bdf8;bottom:-80px;right:-80px;animation-delay:3s}
.orb3{width:200px;height:200px;background:#818cf8;top:40%;left:60%;animation-delay:5s}
@keyframes flutuaOrb{
  from{transform:translate(0,0) scale(1)}
  to{transform:translate(30px,20px) scale(1.15)}
}

/* ── LAYOUT ── */
.container{
  position:relative;z-index:10;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}

/* ── CARD ── */
.card{
  background:rgba(255,255,255,.97);
  border-radius:20px;
  width:100%;max-width:420px;
  padding:44px 40px 40px;
  box-shadow:
    0 32px 80px rgba(0,0,0,.35),
    0 0 0 1px rgba(255,255,255,.15);
  animation:entrar .5s cubic-bezier(.34,1.56,.64,1) both
}
@keyframes entrar{
  from{opacity:0;transform:translateY(32px) scale(.96)}
  to{opacity:1;transform:none}
}

/* ── LOGO AREA ── */
.logo-area{text-align:center;margin-bottom:32px}
.logo-icon{
  width:64px;height:64px;
  background:var(--azul);
  border-radius:16px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:1.8rem;
  margin-bottom:16px;
  box-shadow:0 8px 24px rgba(0,74,173,.35);
  animation:pulseLogo 3s ease-in-out infinite
}
@keyframes pulseLogo{
  0%,100%{box-shadow:0 8px 24px rgba(0,74,173,.35)}
  50%{box-shadow:0 8px 32px rgba(0,74,173,.55)}
}
.logo-titulo{
  font-family:'Sora',sans-serif;
  font-size:1.5rem;font-weight:800;
  color:var(--txt);letter-spacing:-.5px
}
.logo-sub{
  font-size:.82rem;color:var(--sub);
  margin-top:4px;font-weight:500
}

/* ── FORM ── */
.form-titulo{
  font-family:'Sora',sans-serif;
  font-size:.88rem;font-weight:700;
  color:var(--azul);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:20px;
  display:flex;align-items:center;gap:8px
}
.form-titulo::before{
  content:'';display:block;
  width:3px;height:14px;
  background:var(--azul);border-radius:2px
}

.cmp{margin-bottom:16px}
.cmp label{
  display:block;font-size:.72rem;font-weight:700;
  color:var(--sub);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:6px
}
.inp-wrap{position:relative}
.inp-icon{
  position:absolute;left:13px;top:50%;transform:translateY(-50%);
  font-size:1rem;pointer-events:none;opacity:.5
}
.cmp input{
  width:100%;padding:12px 14px 12px 40px;
  border:1.5px solid var(--borda);border-radius:10px;
  font-size:.92rem;font-family:'DM Sans',sans-serif;
  color:var(--txt);background:#fff;outline:none;
  transition:border .15s,box-shadow .15s
}
.cmp input:focus{
  border-color:var(--azul2);
  box-shadow:0 0 0 3px rgba(26,111,212,.12)
}
.cmp input.erro-inp{
  border-color:var(--erro);
  box-shadow:0 0 0 3px rgba(239,68,68,.1)
}

/* ── TOGGLE SENHA ── */
.btn-eye{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;
  font-size:1rem;color:var(--sub);padding:2px;
  transition:opacity .15s
}
.btn-eye:hover{opacity:.7}

/* ── MENSAGEM ERRO ── */
.msg-erro{
  display:none;
  background:#fef2f2;border:1px solid #fecaca;
  border-radius:8px;padding:10px 14px;
  font-size:.82rem;color:#dc2626;font-weight:600;
  margin-bottom:16px;
  animation:shake .3s ease
}
.msg-erro.vis{display:flex;align-items:center;gap:8px}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  75%{transform:translateX(6px)}
}

/* ── BTN LOGIN ── */
.btn-login{
  width:100%;padding:13px;
  background:var(--azul);color:#fff;
  border:none;border-radius:10px;
  font-family:'Sora',sans-serif;
  font-size:.95rem;font-weight:700;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:background .15s,transform .1s,box-shadow .15s;
  box-shadow:0 4px 14px rgba(0,74,173,.3)
}
.btn-login:hover{background:var(--azul2);box-shadow:0 6px 20px rgba(0,74,173,.4)}
.btn-login:active{transform:scale(.98)}
.btn-login:disabled{background:#94a3b8;cursor:not-allowed;box-shadow:none;transform:none}

/* ── SPINNER ── */
.spin{
  width:18px;height:18px;
  border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;
  border-radius:50%;
  animation:girar .6s linear infinite;
  display:none
}
@keyframes girar{to{transform:rotate(360deg)}}

/* ── CADASTRO ── */
.link-cadastro{
  text-align:center;margin-top:18px;
  font-size:.8rem;color:var(--sub)
}
.link-cadastro a{
  color:var(--azul);font-weight:700;
  text-decoration:none;cursor:pointer
}
.link-cadastro a:hover{text-decoration:underline}

/* ── MODAL CADASTRO ── */
.bd{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);
  z-index:500;align-items:center;justify-content:center}
.bd.ab{display:flex}
.modal-cad{
  background:#fff;border-radius:16px;
  width:100%;max-width:400px;
  padding:32px 32px 28px;
  box-shadow:0 24px 60px rgba(0,0,0,.3);
  animation:entrar .3s ease
}
.modal-cad h2{
  font-family:'Sora',sans-serif;
  font-size:1.1rem;font-weight:800;
  color:var(--azul);margin-bottom:20px
}
.modal-cad .mac{
  display:grid;grid-template-columns:1fr 1fr;
  gap:10px;margin-top:20px
}
.btn{
  padding:11px;border:none;border-radius:8px;
  font-size:.88rem;font-weight:700;cursor:pointer;
  font-family:'DM Sans',sans-serif;
  transition:opacity .15s
}
.btn:hover{opacity:.85}
.bv{background:var(--verde);color:#fff}
.bc{background:#e2e8f0;color:var(--txt)}

/* ── RODAPÉ ── */
.rodape{
  text-align:center;margin-top:24px;
  font-size:.72rem;color:rgba(255,255,255,.4);
  position:relative;z-index:10
}

/* ── TOAST ── */
#toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);
  z-index:9999;color:#fff;padding:11px 20px;border-radius:9px;
  font-size:.85rem;font-weight:600;display:none;
  white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.2);
  font-family:'DM Sans',sans-serif
}
#toast.vis{display:block}
#toast.ok{background:#16a34a}
#toast.er{background:#dc2626}
</style>
</head>
<body>

<!-- FUNDO -->
<div class="bg">
  <div class="grid"></div>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- LOGIN CARD -->
<div class="container">
  <div>
    <div class="card">
      <div class="logo-area">
        <div class="logo-icon">🔧</div>
        <div class="logo-titulo">OMG Sistemas/div>
        <div class="logo-sub">Sistema de Gestão</div>
      </div>

      <div class="form-titulo">Acesso ao Sistema</div>

      <div class="msg-erro" id="msg-erro">
        <span>⚠️</span><span id="msg-erro-txt">Usuário ou senha incorretos.</span>
      </div>

      <div class="cmp">
        <label>Usuário</label>
        <div class="inp-wrap">
          <span class="inp-icon">👤</span>
          <input type="text" id="inp-user" placeholder="Digite seu usuário"
            autocomplete="username" onkeydown="if(event.key==='Enter')focarSenha()">
        </div>
      </div>

      <div class="cmp">
        <label>Senha</label>
        <div class="inp-wrap">
          <span class="inp-icon">🔒</span>
          <input type="password" id="inp-senha" placeholder="••••••••"
            autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
          <button class="btn-eye" id="btn-eye" onclick="toggleSenha()" type="button" tabindex="-1">👁️</button>
        </div>
      </div>

      <button class="btn-login" id="btn-login" onclick="login()">
        <div class="spin" id="spin"></div>
        <span id="btn-txt">🚀 Entrar no Sistema</span>
      </button>

      <div class="link-cadastro">
        Novo usuário? <a onclick="abrirCadastro()">Cadastrar acesso</a>
      </div>
    </div>

    <div class="rodape">OMG Soluções Digitais © 2025</div>
  </div>
</div>

<!-- MODAL CADASTRO -->
<div class="bd" id="modal-cad">
  <div class="modal-cad">
    <button onclick="fecharCadastro()" style="float:right;background:none;border:none;font-size:1.3rem;cursor:pointer;color:#9ca3af">✕</button>
    <h2>➕ Cadastrar Usuário</h2>

    <div class="cmp">
      <label>Usuário *</label>
      <div class="inp-wrap">
        <span class="inp-icon">👤</span>
        <input type="text" id="cad-user" placeholder="Nome de usuário" autocomplete="off">
      </div>
    </div>
    <div class="cmp">
      <label>Senha *</label>
      <div class="inp-wrap">
        <span class="inp-icon">🔒</span>
        <input type="password" id="cad-senha" placeholder="Mínimo 4 caracteres">
      </div>
    </div>
    <div class="cmp">
      <label>Confirmar Senha *</label>
      <div class="inp-wrap">
        <span class="inp-icon">🔒</span>
        <input type="password" id="cad-conf" placeholder="Repita a senha"
          onkeydown="if(event.key==='Enter')cadastrar()">
      </div>
    </div>
    <div class="cmp">
      <label>Senha de Administrador *</label>
      <div class="inp-wrap">
        <span class="inp-icon">🛡️</span>
        <input type="password" id="cad-admin" placeholder="Necessária para criar usuários">
      </div>
    </div>

    <div class="mac">
      <button class="btn bc" onclick="fecharCadastro()">Cancelar</button>
      <button class="btn bv" onclick="cadastrar()">✅ Cadastrar</button>
    </div>
  </div>
</div>

<script>
var SB_URL = 'https://bezfgfoqgmrczehfflfw.supabase.co';
var SB_KEY = 'sb_publishable_Y1XJuBfpheJb7QM6nChNKw_sel05c_p';
var SENHA_ADMIN = 'gu16ma16'; /* senha para liberar cadastro de novo usuário */
var db = window.supabase.createClient(SB_URL, SB_KEY);

var _tt;
function toast(m,t){
  var e=document.getElementById('toast');
  e.textContent=m;e.className='vis '+(t||'ok');
  clearTimeout(_tt);_tt=setTimeout(function(){e.className=''},3500);
}

function focarSenha(){
  document.getElementById('inp-senha').focus();
}

function toggleSenha(){
  var inp=document.getElementById('inp-senha');
  var btn=document.getElementById('btn-eye');
  if(inp.type==='password'){ inp.type='text'; btn.textContent='🙈'; }
  else{ inp.type='password'; btn.textContent='👁️'; }
}

function setLoading(v){
  document.getElementById('spin').style.display=v?'block':'none';
  document.getElementById('btn-txt').style.display=v?'none':'inline';
  document.getElementById('btn-login').disabled=v;
}

function mostrarErro(msg){
  var el=document.getElementById('msg-erro');
  document.getElementById('msg-erro-txt').textContent=msg;
  el.classList.add('vis');
  document.getElementById('inp-user').classList.add('erro-inp');
  document.getElementById('inp-senha').classList.add('erro-inp');
  setTimeout(function(){
    el.classList.remove('vis');
    document.getElementById('inp-user').classList.remove('erro-inp');
    document.getElementById('inp-senha').classList.remove('erro-inp');
  },4000);
}

async function login(){
  var user  = document.getElementById('inp-user').value.trim();
  var senha = document.getElementById('inp-senha').value;
  if(!user||!senha){ mostrarErro('Preencha usuário e senha!'); return; }

  setLoading(true);
  try{
    /* Busca usuário pelo nome (case-insensitive) */
    var r = await db.from('usuarios')
      .select('id,usuario,senha,ativo,pagina')
      .ilike('usuario', user)
      .eq('ativo', true)
      .single();

    if(r.error||!r.data){
      mostrarErro('Usuário não encontrado ou inativo.');
      setLoading(false); return;
    }

    /* Compara senha (texto simples — para bcrypt, usar Edge Function) */
    if(r.data.senha !== senha){
      mostrarErro('Senha incorreta. Tente novamente.');
      setLoading(false); return;
    }

    /* Salva sessão no sessionStorage */
    sessionStorage.setItem('mendezza_user', JSON.stringify({
      id:      r.data.id,
      usuario: r.data.usuario,
      pagina:  r.data.pagina || 'vendas.html'
    }));

    toast('✅ Bem-vindo, '+r.data.usuario+'!','ok');

    /* Redireciona para a página do usuário */
    var destino = r.data.pagina || 'vendas.html';
    setTimeout(function(){ window.location.href = destino; }, 800);

  }catch(e){
    mostrarErro('Erro de conexão. Tente novamente.');
    console.error(e);
    setLoading(false);
  }
}

/* ── CADASTRO ── */
function abrirCadastro(){
  ['cad-user','cad-senha','cad-conf','cad-admin'].forEach(function(id){
    document.getElementById(id).value='';
  });
  document.getElementById('modal-cad').classList.add('ab');
  setTimeout(function(){ document.getElementById('cad-user').focus(); },80);
}
function fecharCadastro(){
  document.getElementById('modal-cad').classList.remove('ab');
}

async function cadastrar(){
  var user  = document.getElementById('cad-user').value.trim();
  var senha = document.getElementById('cad-senha').value;
  var conf  = document.getElementById('cad-conf').value;
  var admin = document.getElementById('cad-admin').value;

  if(!user)               { toast('Informe o nome de usuário!','er'); return; }
  if(senha.length < 4)    { toast('Senha deve ter no mínimo 4 caracteres!','er'); return; }
  if(senha !== conf)      { toast('As senhas não coincidem!','er'); return; }
  if(admin !== SENHA_ADMIN){ toast('Senha de administrador incorreta!','er'); return; }

  /* Verifica se usuário já existe */
  var chk = await db.from('usuarios').select('id').ilike('usuario',user).maybeSingle();
  if(chk.data){ toast('Usuário "'+user+'" já existe!','er'); return; }

  var r = await db.from('usuarios').insert({
    usuario: user,
    senha:   senha,
    ativo:   true,
    pagina:  'vendas.html'
  });
  if(r.error){ toast('❌ Erro: '+r.error.message,'er'); return; }

  toast('✅ Usuário cadastrado com sucesso!','ok');
  fecharCadastro();
  document.getElementById('inp-user').value = user;
  document.getElementById('inp-senha').focus();
}

/* Foca no campo usuário ao carregar */
window.addEventListener('load', function(){
  document.getElementById('inp-user').focus();

  /* Se já tem sessão ativa, redireciona direto */
  var sess = sessionStorage.getItem('mendezza_user');
  if(sess){
    try{
      var u = JSON.parse(sess);
      window.location.href = u.pagina || 'vendas.html';
    }catch(e){ sessionStorage.removeItem('mendezza_user'); }
  }
});
</script>
</body>
</html>
